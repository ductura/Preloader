# Weekly version updates, grouped (DAN-922); same pattern as ductura/.github.
# Cooldown as in Ductus: a release is proposed only after it has been public for
# a while, so a hijacked release is usually pulled first. Security updates are
# not delayed by cooldown. The actions group also bumps the reusable ci-node.yml
# pin, so those PRs touch .github/** and are critical.
# Checked by test/dependabot.test.ts (pnpm test, CI job node).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
