name: CI
on:
  push: { branches: [main, migracija/nextjs] }
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  node:
    uses: ductura/.github/.github/workflows/ci-node.yml@98f62800577910b24451809d40c247ee1f04c7c1 # main, DAN-735
    with:
      scripts: typecheck test build budget
  # P-0.11: matrica uređaja u tri motora (Chromium, Firefox, WebKit). Opera je ručna provjera.
  # DAN-1101: the job runs in the official Playwright image (tag index, pinned by
  # digest). The image brings the browsers and their system packages, so the job
  # has no apt and no `playwright install`. Its tag names the @playwright/test pin
  # from package.json (test/e2e-image.test.ts); the digest is what Docker pulls, and
  # a browser of another revision fails pnpm e2e. The image lacks DejaVu Sans, which
  # the DAN-1076 baselines were made with on ubuntu-24.04, so the runner's own two
  # DejaVu Sans files are mounted read-only and checked before the tests (a missing
  # host file becomes an empty directory and fails the sha256 check).
  e2e-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      volumes:
        - /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:ro
        - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:ro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the DejaVu fonts from the runner
        shell: bash
        run: |
          set -euo pipefail
          cd /usr/share/fonts/truetype/dejavu
          ls -l
          sha256sum --strict --check <<'SUMS'
          ae7b7855e115a5966d8b1b3f80f254ccc117ec86f9965e202ee2940453837280  DejaVuSans.ttf
          5c1247acef7f2b8522a31742c76d6adcb5569bacc0be7ceaa4dc39dd252ce895  DejaVuSans-Bold.ttf
          SUMS
          fc-cache -f
          # The match must be the checked file itself, not just a face of that name.
          for q in sans-serif system-ui sans-serif:lang=hr; do
            test "$(fc-match -f '%{family[0]}|%{file}' "$q")" = "DejaVu Sans|$PWD/DejaVuSans.ttf"
          done
          test "$(fc-match -f '%{family[0]}|%{style[0]}|%{file}' sans-serif:bold)" = "DejaVu Sans|Bold|$PWD/DejaVuSans-Bold.ttf"
      - run: pnpm e2e
        env:
          # Firefox as root refuses a HOME owned by another user (/github/home).
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: e2e-matrix-report, path: playwright-report/, retention-days: 7 }

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [node, e2e-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          problems="$(jq -r 'to_entries[] | ((.value | objects | .result) // "missing") as $r
            | select($r != "success") | "job \(.key) result: \($r)"' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
