name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  node:
    uses: ductura/.github/.github/workflows/ci-node.yml@98f62800577910b24451809d40c247ee1f04c7c1 # main, DAN-735
    with:
      scripts: typecheck test build budget
  # P-0.11: matrica uređaja u tri motora (Chromium, Firefox, WebKit). Opera je ručna provjera.
  e2e-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: e2e-matrix-report, path: playwright-report/, retention-days: 7 }

  # DAN-1096: laboratorij spremanja i oporavka (docs/lab-oporavak.md) nad stogom
  # VS-1 točnog SHA-a servera. Izvještaj je artefakt lab-oporavak.
  lab-oporavak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PGBIN: /usr/lib/postgresql/17/bin
      SERVER_SHA: f2d5178f136551eb2ec1d51eac9ea9815c1ff1ba # ductura/server main, DAN-759
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: ductura/server, ref: "${{ env.SERVER_SHA }}", path: server-src, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      # Isti PGDG korak kao u ductura/server ci.yml (DAN-953), bez pgTAP paketa.
      - name: Install PostgreSQL 17 (PGDG)
        env:
          PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          pgdg_install() {
            curl -fsSL -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc &&
              gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | grep -qx "fpr:::::::::$PGDG_KEY_FINGERPRINT:" &&
              sudo install -D -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc &&
              . /etc/os-release &&
              echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main"                 | sudo tee /etc/apt/sources.list.d/pgdg.list &&
              sudo apt-get update -q &&
              sudo apt-get install -y -q --no-install-recommends postgresql-17
          }
          pgdg_install || { echo "::warning::PGDG install failed, retrying once in 30 s"; sleep 30; pgdg_install; }
      - run: pnpm install --frozen-lockfile
      - name: Build the server
        working-directory: server-src
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Run the lab
        env:
          SERVER_DIR: ${{ github.workspace }}/server-src
          LAB_PRELOADER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PATH="$PGBIN:$PATH" pnpm lab:oporavak
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: lab-oporavak, path: lab-oporavak.json, retention-days: 30 }

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [node, e2e-matrix, lab-oporavak]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          problems="$(jq -r 'to_entries[] | ((.value | objects | .result) // "missing") as $r
            | select($r != "success") | "job \(.key) result: \($r)"' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
