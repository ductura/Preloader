name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  node:
    uses: ductura/.github/.github/workflows/ci-node.yml@98f62800577910b24451809d40c247ee1f04c7c1 # main, DAN-735
    with:
      scripts: typecheck test build budget
  # P-0.11: matrica uređaja u tri motora (Chromium, Firefox, WebKit). Opera je ručna provjera.
  # DAN-1097: the official Playwright image (tag index, pinned by digest) brings the
  # browsers, so there is no apt and no `playwright install`. The image lacks DejaVu
  # Sans, which the DAN-1076 baselines were made with; the fonts come from e2e/fonts.
  # The job is an allowlist checked by test/e2e-image.test.ts.
  e2e-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Install DejaVu fonts from the repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          cd e2e/fonts
          sha256sum --strict --check SHA256SUMS
          install -D -m 0644 -t /usr/share/fonts/truetype/dejavu DejaVuSans.ttf DejaVuSans-Bold.ttf
          fc-cache -f
          for q in sans-serif system-ui sans-serif:lang=hr; do
            test "$(fc-match -f '%{family[0]}' "$q")" = 'DejaVu Sans'
          done
          test "$(fc-match -f '%{family[0]}|%{style[0]}' sans-serif:bold)" = 'DejaVu Sans|Bold'
      - run: pnpm e2e
        env:
          # Firefox as root refuses a HOME owned by another user (/github/home).
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: e2e-matrix-report, path: playwright-report/, retention-days: 7 }

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [node, e2e-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          problems="$(jq -r 'to_entries[] | ((.value | objects | .result) // "missing") as $r
            | select($r != "success") | "job \(.key) result: \($r)"' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
